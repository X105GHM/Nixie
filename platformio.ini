[env:esp32-s3-wroom-1-n16r8]
platform = espressif32@6.11.0
board    = esp32-s3-devkitc-1 
framework = arduino

build_unflags = 
  -std=gnu++11

build_flags =
  -include src/undef_ip.h
  -UIPADDR_NONE
  -UINADDR_NONE
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -Wno-deprecated-declarations
  -D OPENWEATHER_API_KEY=\"03320529953b65ed248ff69a03120c32\"
  -std=gnu++17

board_build.partitions              = partitions.csv
board_build.filesystem              = spiffs

board_build.flash_mode              = qio
board_upload.flash_size             = 16MB
board_upload.maximum_size           = 16777216

board_build.arduino.memory_type     = qio_qspi   ; Flash-Interface
board_build.psram_type              = octal      ; PSRAM-Interface
board_build.extra_flags             = -DBOARD_HAS_PSRAM
board_build.psram                   = enabled

monitor_speed                       = 115200

lib_deps =
  wnatth3/WiFiManager@^2.0.16-rc.2

extra_scripts = 
 -extra_script.py
 -pre:get_version.py
